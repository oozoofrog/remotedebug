# RemoteDebugMac 대상 정의. project.yml이 포함한다(경로는 저장소 루트 기준).
targets:
  RemoteDebugMac:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: Apps/Mac
        excludes:
          - "project-*.yml"
    entitlements:
      path: Apps/Mac/RemoteDebugMac.entitlements
      # App Sandbox를 쓰지 않는다. 연결한 프로젝트를 xcodebuild로 빌드하고 Xcode의 DerivedData를 읽어야 한다.
      properties: {}
    info:
      path: Apps/Mac/Info.plist
      properties:
        CFBundleDisplayName: RemoteDebug
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        # 이 앱을 빌드한 저장소. **iPhone 앱 설치…**가 여기의 RemoteDebug.xcodeproj로 iPhone 앱을 빌드한다.
        # 배포용 빌드(scripts/release-mac.sh)는 RD_SOURCE_ROOT를 비워 이 Mac의 경로를 넣지 않는다.
        RDSourceRoot: $(RD_SOURCE_ROOT)
        LSMinimumSystemVersion: "26.0"
        NSUserNotificationAlertStyle: alert
        # 같은 네트워크의 iPhone이 이 Mac을 찾도록 Bonjour로 알린다(docs/protocol-addenda.md O).
        NSLocalNetworkUsageDescription: 같은 네트워크의 페어링한 iPhone이 VPN 없이 이 Mac에 연결하도록 알립니다.
        NSBonjourServices:
          - _remotedebug._tcp
        # 프로젝트 폴더·프로젝트 파일·빌드를 Dock 아이콘에 끌어 놓거나 `open -a RemoteDebug <경로>`로 넘길 수 있다.
        CFBundleDocumentTypes:
          - CFBundleTypeName: 프로젝트 폴더 또는 빌드
            CFBundleTypeRole: Viewer
            LSHandlerRank: None
            LSItemContentTypes:
              - public.folder
              - com.apple.xcode.project
              - com.apple.dt.document.workspace
              - com.apple.application-bundle
              - com.apple.itunes.ipa
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.oozoofrog.app.RemoteDebugMac
        PRODUCT_NAME: RemoteDebug
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: $(RD_MAC_SIGN_IDENTITY)
        ENABLE_HARDENED_RUNTIME: YES
        RD_SOURCE_ROOT: $(SRCROOT)
        # RDCore.xcframework는 arm64 전용이다(Apple silicon).
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES
    # 화면·미리보기는 MacHostUI(Go 런타임 없음), 실제 코어 연결은 MacHostCore(RDCoreBridge)에 있다.
    dependencies:
      - package: MacHost
        product: MacHostKit
      - package: MacHost
        product: MacHostUI
      - package: MacHost
        product: MacHostCore
  RemoteDebugMacTests:
    type: bundle.unit-test
    platform: macOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: Apps/MacTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oozoofrog.app.RemoteDebugMacTests
        # 앱 PRODUCT_NAME이 RemoteDebug라 xcodegen 기본값(대상 이름)과 다르다.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/RemoteDebug.app/Contents/MacOS/RemoteDebug
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: $(RD_MAC_SIGN_IDENTITY)
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES
    dependencies:
      - target: RemoteDebugMac
schemes:
  RemoteDebugMac:
    build:
      targets:
        RemoteDebugMac: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RemoteDebugMacTests
