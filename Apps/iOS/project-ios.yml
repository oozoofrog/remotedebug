# RemoteDebugPhone·RemoteDebugTunnel 대상 정의. project.yml이 포함한다(경로는 저장소 루트 기준).
# 번들 ID는 $(RD_BUNDLE_PREFIX)로 시작한다(Config/Signing.xcconfig). 기본 앞부분이면 com.oozoofrog.app.RemoteDebugPhone,
# com.oozoofrog.app.RemoteDebugPhone.Tunnel, com.oozoofrog.app.RemoteDebugPhone.Widgets가 된다.
# VPN만 맡는 두 번째 앱은 com.oozoofrog.app.RemoteDebugVPN, 그 터널은 com.oozoofrog.app.RemoteDebugVPN.Tunnel이다.
# 두 앱은 App Group(group.<앞부분>.RemoteDebug)으로 같은 Tailscale 상태를 써서 같은 tailnet 기기로 보인다.
targets:
  RemoteDebugPhone:
    type: application
    platform: iOS
    # 개발 팀 ID는 Config/Signing.local.xcconfig(저장소에 올리지 않음)에서 읽는다. xcodegen을 다시 돌려도 남는다.
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: Apps/iOS
        excludes:
          - "project-*.yml"
      # 앱과 확장이 함께 쓰는 형식(TunnelProviderConfig, 메시지, SettingsTranslator).
      - path: Apps/iOSTunnel/Shared
      # 라이브 액티비티 형식(위젯 확장과 같이 쓴다).
      - path: Apps/iOSWidgets/Shared
    entitlements:
      path: Apps/iOS/RemoteDebugPhone.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.security.application-groups:
          - group.$(RD_BUNDLE_PREFIX).RemoteDebug
    info:
      path: Apps/iOS/Info.plist
      properties:
        CFBundleDisplayName: RemoteDebug
        # 두 앱과 두 터널 확장이 함께 쓰는 저장소(SharedContainer).
        RDAppGroup: group.$(RD_BUNDLE_PREFIX).RemoteDebug
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: 페어링 QR 코드를 읽는 데 카메라를 사용합니다.
        # Mac에서 받은 파일(Documents)을 파일 앱에 보인다.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # 파일 받기 진행을 잠금 화면과 Dynamic Island에 보인다.
        NSSupportsLiveActivities: true
        # 설정 앱의 분석 데이터에서 크래시 파일(.ips)을 공유로 넘겨받는다.
        CFBundleDocumentTypes:
          - CFBundleTypeName: 크래시 기록
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.apple.ips
              - com.apple.crashreport
        CFBundleURLTypes:
          - CFBundleURLName: com.oozoofrog.app.RemoteDebugPhone.pair
            CFBundleURLSchemes:
              - remotedebug
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: $(RD_BUNDLE_PREFIX).RemoteDebugPhone
        PRODUCT_NAME: RemoteDebug
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # 시뮬레이터만 로컬 서명. 기기 빌드는 Xcode 기본 신원(Apple Development)과 DEVELOPMENT_TEAM으로 서명한다.
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        # RDCore.xcframework의 iOS 슬라이스는 arm64 전용이다.
        ARCHS: arm64
    dependencies:
      - target: RemoteDebugTunnel
        embed: true
      - target: RemoteDebugWidgets
        embed: true
      - package: RemoteDebugKit
        product: RDModels
      - package: PhoneClient
        product: PhoneClientKit
  RemoteDebugTunnel:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: Apps/iOSTunnel
    entitlements:
      path: Apps/iOSTunnel/RemoteDebugTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.security.application-groups:
          - group.$(RD_BUNDLE_PREFIX).RemoteDebug
    info:
      path: Apps/iOSTunnel/Info.plist
      properties:
        CFBundleDisplayName: RemoteDebug 터널
        RDAppGroup: group.$(RD_BUNDLE_PREFIX).RemoteDebug
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RD_BUNDLE_PREFIX).RemoteDebugPhone.Tunnel
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        # 시뮬레이터만 로컬 서명. 기기 빌드는 Xcode 기본 신원(Apple Development)과 DEVELOPMENT_TEAM으로 서명한다.
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        ARCHS: arm64
    dependencies:
      - package: RDCore
        product: RDCoreBridge
      - package: RemoteDebugKit
        product: RDModels
  RemoteDebugWidgets:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: Apps/iOSWidgets
        excludes:
          - Info.plist
    info:
      path: Apps/iOSWidgets/Info.plist
      properties:
        CFBundleDisplayName: RemoteDebug 위젯
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RD_BUNDLE_PREFIX).RemoteDebugPhone.Widgets
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        ARCHS: arm64
        TARGETED_DEVICE_FAMILY: "1"
  # VPN만 맡는 앱. RemoteDebug 앱을 업데이트하는 동안에도 VPN을 유지한다. 터널 확장은 RemoteDebugTunnel과 같은 소스다.
  RemoteDebugVPN:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: Apps/iOSVPN
        excludes:
          - "*.entitlements"
      - path: Apps/iOSTunnel/Shared
      - path: Apps/iOS/Adapters/TunnelController.swift
      - path: Apps/iOS/Adapters/TunnelSettingsStore.swift
      - path: Apps/iOS/Adapters/TunnelStateMapping.swift
      - path: Apps/iOS/Adapters/UIKitURLOpener.swift
    entitlements:
      path: Apps/iOSVPN/RemoteDebugVPN.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.security.application-groups:
          - group.$(RD_BUNDLE_PREFIX).RemoteDebug
    info:
      path: Apps/iOSVPN/Info.plist
      properties:
        CFBundleDisplayName: RD VPN
        RDAppGroup: group.$(RD_BUNDLE_PREFIX).RemoteDebug
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: com.oozoofrog.app.RemoteDebugVPN.control
            CFBundleURLSchemes:
              - remotedebug-vpn
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: $(RD_BUNDLE_PREFIX).RemoteDebugVPN
        PRODUCT_NAME: RemoteDebugVPN
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        ARCHS: arm64
    dependencies:
      - target: RemoteDebugVPNTunnel
        embed: true
      - package: RemoteDebugKit
        product: RDModels
      - package: PhoneClient
        product: PhoneClientKit
  RemoteDebugVPNTunnel:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: Apps/iOSTunnel
        excludes:
          - Info.plist
          - "*.entitlements"
    entitlements:
      path: Apps/iOSVPN/RemoteDebugVPNTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.security.application-groups:
          - group.$(RD_BUNDLE_PREFIX).RemoteDebug
    info:
      path: Apps/iOSVPN/TunnelInfo.plist
      properties:
        CFBundleDisplayName: RD VPN 터널
        RDAppGroup: group.$(RD_BUNDLE_PREFIX).RemoteDebug
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RD_BUNDLE_PREFIX).RemoteDebugVPN.Tunnel
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        ARCHS: arm64
    dependencies:
      - package: RDCore
        product: RDCoreBridge
      - package: RemoteDebugKit
        product: RDModels
  RemoteDebugPhoneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Apps/iOSTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oozoofrog.app.RemoteDebugPhoneTests
        GENERATE_INFOPLIST_FILE: YES
        # 앱의 PRODUCT_NAME이 RemoteDebug라서 XcodeGen 기본값(대상 이름)과 다르다.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/RemoteDebug.app/RemoteDebug
        BUNDLE_LOADER: $(TEST_HOST)
        ARCHS: arm64
    dependencies:
      - target: RemoteDebugPhone
schemes:
  RemoteDebugVPN:
    build:
      targets:
        RemoteDebugVPN: all
    run:
      config: Debug
  RemoteDebugPhone:
    build:
      targets:
        RemoteDebugPhone: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RemoteDebugPhoneTests
