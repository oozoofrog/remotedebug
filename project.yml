name: RemoteDebug
options:
  bundleIdPrefix: com.oozoofrog.app
  createIntermediateGroups: true
  developmentLanguage: ko
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "41"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # 문자열 추출은 scripts/sync-strings.sh가 세 스킴을 한꺼번에 빌드해 한다. Xcode에서 빌드할 때 대상마다
    # Localization/Localizable.xcstrings를 다시 쓰면 다른 플랫폼의 키가 stale이 되므로 끈다(docs/architecture.md).
    SWIFT_EMIT_LOC_STRINGS: NO
    STRING_CATALOG_GENERATE_SYMBOLS: NO
packages:
  RemoteDebugKit:
    path: Packages/RemoteDebugKit
  RDCore:
    path: Packages/RDCore
  MacHost:
    path: Packages/MacHost
  PhoneClient:
    path: Packages/PhoneClient
# 앱별 대상은 각 앱 작업이 자기 포함 파일만 고친다.
include:
  - path: Apps/Mac/project-mac.yml
    relativePaths: false
  - path: Apps/iOS/project-ios.yml
    relativePaths: false
